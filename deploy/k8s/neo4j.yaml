apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
spec:
  serviceName: neo4j
  replicas: 1
  selector: { matchLabels: { app: neo4j } }
  template:
    metadata: { labels: { app: neo4j } }
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.26-community        # pull through your Nexus Docker proxy
          ports:
            - { name: http, containerPort: 7474 }
            - { name: bolt, containerPort: 7687 }
          env:
            - name: NEO4J_AUTH
              valueFrom: { secretKeyRef: { name: kg-secrets, key: NEO4J_AUTH } }
            - { name: NEO4J_server_memory_heap_max__size, value: "4G" }
            - { name: NEO4J_server_memory_pagecache_size, value: "4G" }
          resources:
            requests: { cpu: "1", memory: 6Gi }
            limits: { memory: 10Gi }
          readinessProbe:
            tcpSocket: { port: 7687 }
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 50Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
spec:
  selector: { app: neo4j }
  ports:
    - { name: http, port: 7474 }
    - { name: bolt, port: 7687 }
