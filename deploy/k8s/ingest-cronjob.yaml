apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kg-data          # git mirrors + parse cache; survives between runs so nightly runs are incremental
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 100Gi } }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kg-ingest
spec:
  schedule: "0 2 * * *"          # 02:00 nightly (cluster timezone)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      template:
        spec:
          restartPolicy: Never
          securityContext: { fsGroup: 10001 }
          containers:
            - name: ingest
              image: kg
              args: ["ingest"]
              envFrom:
                - configMapRef: { name: kg-config }
                - secretRef: { name: kg-secrets }
              resources:
                requests: { cpu: "2", memory: 4Gi }
                limits: { memory: 12Gi }   # the whole graph is resolved in memory (~100 repos)
              volumeMounts:
                - { name: data, mountPath: /data }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: kg-data }
