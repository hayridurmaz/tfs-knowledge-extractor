# Do not commit real values. Create the secret with:
#   kubectl -n kg create secret generic kg-secrets \
#     --from-literal=KG_ADO_PAT=<pat with Code (Read) scope> \
#     --from-literal=KG_NEO4J_PASSWORD=<strong password> \
#     --from-literal=NEO4J_AUTH=neo4j/<same strong password>
apiVersion: v1
kind: Secret
metadata:
  name: kg-secrets
type: Opaque
stringData:
  KG_ADO_PAT: "changeme"
  KG_NEO4J_PASSWORD: "changeme"
  NEO4J_AUTH: "neo4j/changeme"
