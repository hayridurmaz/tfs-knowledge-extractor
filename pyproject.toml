[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kg"
version = "0.2.0"
description = "Knowledge graph extractor for Azure DevOps Server + Confluence, served to coding agents via MCP"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-typescript>=0.23",
    "neo4j>=5.20",
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kg = "kg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["neo4j: needs a running Neo4j (set KG_NEO4J_URI)"]
